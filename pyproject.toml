[project]
name = "multiagents-rag-fnb"
version = "0.1.0"
description = "Multi-agent Graph-RAG ordering platform for F&B"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.25.0",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "pyyaml>=6.0",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.18",
    "orjson==3.10.12",
    "httpx==0.28.1",
    "rich==13.9.4",
    "neo4j==5.27.0",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "scikit-learn",
    "requests==2.32.3",
    "pytest==8.3.4",
    "pytest-asyncio==0.25.0",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "asyncpg",
    "alembic",
    "anthropic>=1,<2",
]

[project.optional-dependencies]
ml = [
    "torch",
    "transformers==4.57.6",
    "huggingface_hub==0.36.0",
    "sentence-transformers",
    "datasets>=3,<4.4",
    "peft",
    "accelerate",
    "bitsandbytes>=0.44.0",
    "trl==0.11.4",
]
ui = [
    "chainlit==2.0.3",
    "sniffio>=1.3.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux'"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs Postgres/Neo4j from docker compose"]
addopts = "-m 'not integration'"
