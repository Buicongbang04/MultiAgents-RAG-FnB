name: fnb

x-neo4j-health: &neo4j-health
  interval: 10s
  timeout: 10s
  retries: 12
  start_period: 20s

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: fnb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fnb}
      POSTGRES_DB: fnb
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnb -d fnb"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:16
    profiles: [test]
    environment:
      POSTGRES_USER: fnb
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fnb}
      POSTGRES_DB: fnb_test
    ports:
      - "${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnb -d fnb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/${NEO4J__PASSWORD:?set NEO4J__PASSWORD in .env}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1'"]
      <<: *neo4j-health

  neo4j-test:
    image: neo4j:5
    profiles: [test]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J__PASSWORD:?set NEO4J__PASSWORD in .env}
    ports:
      - "7475:7474"
      - "7688:7687"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 >/dev/null"]
      <<: *neo4j-health

  backend:
    build: .
    environment:
      NEO4J__URI: bolt://neo4j:7687
      NEO4J__PASSWORD: ${NEO4J__PASSWORD:?set NEO4J__PASSWORD in .env}
      DATABASE__URL: postgresql+asyncpg://fnb:${POSTGRES_PASSWORD:-fnb}@postgres:5432/fnb
      LLM__BACKEND: ${LLM__BACKEND:-mock}
      EMBEDDING__DEVICE: ${EMBEDDING__DEVICE:-cpu}
      RERANKER__DEVICE: ${RERANKER__DEVICE:-cpu}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - hf_cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  sglang:
    image: lmsysorg/sglang:latest
    profiles: [local-llm]
    command: >
      python3 -m sglang.launch_server
      --model-path Qwen/Qwen2.5-7B-Instruct-AWQ
      --host 0.0.0.0 --port 30000
      --context-length 4096 --mem-fraction-static 0.65
    ports:
      - "30000:30000"
    volumes:
      - hf_cache:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:30000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

volumes:
  postgres_data:
  neo4j_data:
  hf_cache:
