name: ci

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Never real secrets: CI uses throwaway values only. ANTHROPIC_API_KEY is
  # intentionally not set; the LLM backend is mocked.
  NEO4J__PASSWORD: ci-neo4j-password
  EMBEDDING__BACKEND: mock
  RERANKER__BACKEND: "null"
  LLM__BACKEND: mock

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # No `ml` extra: unit tests must not need torch / sentence-transformers.
      - run: uv sync --frozen
      - run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fnb
          POSTGRES_PASSWORD: fnb
          POSTGRES_DB: fnb_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U fnb -d fnb_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      neo4j:
        image: neo4j:5
        env:
          NEO4J_AUTH: neo4j/ci-neo4j-password
        ports:
          - 7688:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 >/dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://fnb:fnb@localhost:5434/fnb_test
      TEST_NEO4J_URI: bolt://localhost:7688
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest -m integration -q
